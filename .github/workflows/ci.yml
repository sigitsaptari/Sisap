name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Tokens Drift
        run: npm run tokens:check

      - name: Check Code Formatting & Tailwind Order
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Unit & Accessibility Tests (Vitest + Axe)
        run: npm run test

      - name: Build React Library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build Playground App
        run: npm run build --workspace @sisapds/playground
